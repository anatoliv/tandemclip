server {
    listen 80;
    server_name tandemclip.com www.tandemclip.com;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Appcast is XML; DMGs are binary downloads; the rest are site assets.
    types {
        text/html                             html;
        application/xml                       xml;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/x-icon                          ico;
        video/mp4                             mp4;
    }
    default_type application/octet-stream;
    sendfile on;

    # Security headers. NOTE: nginx does NOT inherit `add_header` into a location
    # that defines its own, so these are repeated in each location below.
    # TLS is terminated by the fronting proxy (proxy_net); HSTS here is passed
    # through so browsers pin HTTPS for the apex + subdomains.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Every missing path, including a not-yet-published DMG, gets the branded
    # 404 page with status 404. It is never stored, so a probe made before a
    # release cannot leave a cached 404 behind. The error_page redirect lands in
    # this location, so its headers are the ones the 404 response carries.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, no-transform" always;
    }

    location = /appcast.xml {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type application/xml;
    }

    location ~ \.(dmg|delta)$ {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        default_type application/octet-stream;
    }

    location / {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
